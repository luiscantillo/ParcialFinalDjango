{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Programas universitarios{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'myapp/styles.css' %}">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor">
            <h1>Programas universitarios</h1>
            <nav>
                <a href="{% url 'crear_programa' %}">Crear programa</a>
                <a href="/admin/">Administrador</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        {% if messages %}
            {% for message in messages %}
                <div class="alerta alerta-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="pie">
        <div class="contenedor">Desarrollo de Aplicaciones Web I – Parcial final</div>
    </footer>
</body>
</html>
